server {
    listen 80;
    server_name _;

    # Solo la carpeta public/ es visible desde Internet.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 6m;

    # Todo lo que no sea un archivo real lo atiende index.php (Slim)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Si hay un proxy HTTPS delante (Caddy / Nginx Proxy Manager), pasa el esquema real
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Cualquier otro .php no se ejecuta
    location ~ \.php$ {
        return 404;
    }

    # Archivos ocultos (.env, .git...) nunca se sirven
    location ~ /\. {
        deny all;
    }
}
