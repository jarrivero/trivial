server {
    listen 80;
    server_name _;

    # Only the public/ folder is reachable from the Internet.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 6m;

    # Anything that is not a real file is handled by index.php (Slim)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # If there is an HTTPS proxy in front (Caddy / Nginx Proxy Manager), pass the real scheme
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Any other .php file is never executed
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git...) are never served
    location ~ /\. {
        deny all;
    }
}
