; PHP settings for Trivial
date.timezone = Europe/Madrid
expose_php = Off
memory_limit = 128M
upload_max_filesize = 5M
post_max_size = 6M

; Errors go to the log, never to the screen (APP_DEBUG controls what Slim shows)
display_errors = Off
log_errors = On

; 12 h sessions (reconnect on reload)
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
