; Ajustes de PHP para el Trivial
date.timezone = Europe/Madrid
expose_php = Off
memory_limit = 128M
upload_max_filesize = 5M
post_max_size = 6M

; Errores: al log, nunca en pantalla (APP_DEBUG controla lo que ve Slim)
display_errors = Off
log_errors = On

; Sesiones de 12 h (reconexión al recargar)
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
