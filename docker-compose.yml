services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_DEBUG: ${APP_DEBUG:-0}
      DB_PATH: /var/www/html/data/trivial.sqlite
    volumes:
      # Code is mounted from your folder: change a file and reload to see it
      - ./:/var/www/html
      # The database lives in its own volume: it survives rebuilds
      - trivial_data:/var/www/html/data
      # Compiled template cache (PHP must be able to write it)
      - smarty_cache:/var/www/html/var/cache/smarty

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  trivial_data:
  smarty_cache:
